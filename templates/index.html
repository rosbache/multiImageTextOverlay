<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Metadata Overlay</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
     integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
     crossorigin=""/>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1a1a2e;
      --panel: #16213e;
      --card: #0f3460;
      --accent: #e94560;
      --accent2: #457b9d;
      --text: #eaeaea;
      --muted: #8892a4;
      --border: #2a3a5c;
      --input-bg: #0d2137;
      --success: #4caf50;
      --warning: #ff9800;
      --error: #f44336;
      --radius: 6px;
      --gap: 12px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; }
    header span { color: var(--accent); }

    /* ── Main layout ── */
    .main {
      display: grid;
      grid-template-columns: 300px 1fr 220px;
      flex: 1;
      overflow: hidden;
      gap: 0;
    }

    /* ── Panels ── */
    .panel {
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .panel:last-child { border-right: none; border-left: 1px solid var(--border); }
    .panel-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      padding: 10px 14px 6px;
      flex-shrink: 0;
    }
    .panel-scroll { overflow-y: auto; flex: 1; padding: 0 12px 12px; }
    .panel-scroll::-webkit-scrollbar { width: 5px; }
    .panel-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Settings groups ── */
    details { margin-bottom: 6px; }
    details summary {
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      color: var(--accent2);
      padding: 6px 8px;
      background: var(--card);
      border-radius: var(--radius);
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::after { content: '▸'; font-size: .7rem; transition: transform .15s; }
    details[open] summary::after { transform: rotate(90deg); }
    .settings-body { padding: 8px 4px 2px; display: flex; flex-direction: column; gap: 7px; }

    /* ── Form fields ── */
    label { display: flex; flex-direction: column; gap: 3px; font-size: .78rem; color: var(--muted); }
    label input, label select, label textarea {
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: .82rem;
      padding: 5px 8px;
      outline: none;
      transition: border-color .15s;
    }
    label input:focus, label select:focus { border-color: var(--accent2); }
    label input[type=range] { padding: 4px 0; cursor: pointer; }
    label input[type=color] { padding: 2px; height: 30px; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .check-row { flex-direction: row; align-items: center; gap: 8px; }
    .check-row input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
    .range-val { font-size: .78rem; color: var(--accent2); }

    /* ── Preview panel (center) ── */
    .preview-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #0a0f1e;
    }
    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .preview-toolbar span { font-size: .8rem; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .preview-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    #preview-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: var(--radius);
      display: none;
    }
    .preview-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: .9rem;
    }
    .preview-placeholder svg { opacity: .3; }
    #preview-spinner {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(10,15,30,.7);
      align-items: center;
      justify-content: center;
    }
    #preview-spinner.active { display: flex; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Image list (right panel) ── */
    #image-list { display: flex; flex-direction: column; gap: 4px; }
    .img-item {
      padding: 7px 10px;
      background: var(--card);
      border-radius: var(--radius);
      font-size: .78rem;
      cursor: pointer;
      border: 1px solid transparent;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: border-color .12s, background .12s;
    }
    .img-item:hover { border-color: var(--accent2); }
    .img-item.active { border-color: var(--accent); background: #1a0e20; }
    .img-item.selected { border-color: #e9a020; background: #1a1400; }
    .img-item.active.selected { border-color: var(--accent); background: #2a1010; }
    .img-item .check { display: inline-block; width: 13px; height: 13px; border: 1.5px solid var(--muted); border-radius: 3px; margin-right: 7px; flex-shrink: 0; vertical-align: middle; position: relative; top: -1px; }
    .img-item.selected .check { background: #e9a020; border-color: #e9a020; }
    .img-item.selected .check::after { content: ''; position: absolute; left: 3px; top: 0px; width: 5px; height: 8px; border: 2px solid #000; border-top: none; border-left: none; transform: rotate(45deg); }
    .selection-bar { display: none; align-items: center; gap: 6px; padding: 6px 12px; background: #1a1400; border-bottom: 1px solid #e9a02040; flex-shrink: 0; }
    .selection-bar.visible { display: flex; }
    .selection-bar span { font-size: .75rem; color: #e9a020; flex: 1; }
    .no-images { color: var(--muted); font-size: .8rem; text-align: center; padding: 20px 10px; }

    /* ── Bottom bar ── */
    .bottombar {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      flex-wrap: wrap;
    }
    .input-tabs { display: flex; gap: 0; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
    .tab-btn {
      background: var(--input-bg);
      color: var(--muted);
      border: none;
      padding: 6px 14px;
      font-size: .78rem;
      cursor: pointer;
      transition: background .12s, color .12s;
    }
    .tab-btn.active { background: var(--card); color: var(--text); }
    #folder-input-area, #upload-input-area { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    #upload-input-area { display: none; }
    #folder-path-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 6px 10px;
      font-size: .82rem;
      outline: none;
      min-width: 0;
    }
    #folder-path-input:focus { border-color: var(--accent2); }
    #output-path-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      padding: 6px 10px;
      font-size: .82rem;
      outline: none;
      min-width: 0;
    }
    #output-path-input:focus { border-color: var(--accent2); }

    /* drag-and-drop zone */
    #drop-zone {
      flex: 1;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 6px 14px;
      text-align: center;
      font-size: .78rem;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .15s, background .15s;
      min-width: 0;
    }
    #drop-zone.drag-over { border-color: var(--accent); background: rgba(233,69,96,.07); color: var(--accent); }

    /* Buttons */
    .btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px 14px;
      font-size: .82rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, border-color .12s;
    }
    .btn:hover { background: #1a3860; border-color: var(--accent2); }
    .btn-accent { background: var(--accent); border-color: var(--accent); font-weight: 600; }
    .btn-accent:hover { background: #c73652; border-color: #c73652; }
    .btn-green { background: #1a4a1a; border-color: var(--success); }
    .btn-green:hover { background: #245924; }
    .btn-amber { background: #1a1400; border-color: #e9a020; color: #e9a020; }
    .btn-amber:hover { background: #2a2000; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }

    /* Progress */
    .progress-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 140px; }
    progress {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      accent-color: var(--accent);
      background: var(--input-bg);
    }
    #progress-label { font-size: .75rem; color: var(--muted); white-space: nowrap; }
    #status-msg {
      font-size: .75rem;
      padding: 4px 10px;
      border-radius: var(--radius);
      display: none;
    }
    #status-msg.info { background: #0d2137; color: var(--accent2); display: block; }
    #status-msg.ok { background: #0d2a0d; color: var(--success); display: block; }
    #status-msg.err { background: #2a0d0d; color: var(--error); display: block; }

    /* Output dir label */
    .output-label { font-size: .75rem; color: var(--muted); white-space: nowrap; flex-shrink: 0; }
    
    /* ── Map styles ── */
    .center-tabs {
      display: flex;
      gap: 0;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
    }
    .center-tab {
      padding: 8px 16px;
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: .82rem;
      border-bottom: 2px solid transparent;
      transition: all .2s;
    }
    .center-tab:hover { color: var(--text); }
    .center-tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    
    #map-container {
      flex: 1;
      position: relative;
      display: none;
    }
    #map-container.active { display: block; }
    
    #map {
      width: 100%;
      height: 100%;
    }
    
    #preview-container-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    #preview-container-wrapper.active { display: flex; }
    #preview-container-wrapper:not(.active) { display: none; }
    
    .map-controls {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .map-controls .btn {
      font-size: .75rem;
      padding: 6px 10px;
      box-shadow: 0 2px 4px rgba(0,0,0,.3);
    }
    
    .leaflet-popup-content {
      color: #222;
      font-size: .85rem;
    }
    .leaflet-popup-content strong {
      display: block;
      margin-bottom: 4px;
    }
    .edited-marker {
      filter: hue-rotate(90deg) brightness(1.2);
    }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
  </svg>
  <h1>Image Metadata Overlay &nbsp;<span>// Web UI</span></h1>
</header>

<div class="main">

  <!-- ══ LEFT: Settings ══ -->
  <div class="panel">
    <div class="panel-title">Settings</div>
    <div class="panel-scroll" id="settings-scroll">

      <details open>
        <summary>Overlay Text</summary>
        <div class="settings-body">
          <label>Project info
            <input type="text" id="s-project-info" placeholder="e.g. My Survey 2024" />
          </label>
          <label>Text position
            <select id="s-text-position">
              <option value="bottom-left">Bottom-left</option>
              <option value="bottom-right">Bottom-right</option>
              <option value="top-left">Top-left</option>
              <option value="top-right">Top-right</option>
            </select>
          </label>
          <label>Padding (px)
            <input type="number" id="s-padding" min="0" max="200" step="5" />
          </label>
        </div>
      </details>

      <details open>
        <summary>Font</summary>
        <div class="settings-body">
          <label>Font size (pt)
            <input type="number" id="s-font-size" min="8" max="500" step="4" />
          </label>
          <label>Font file
            <select id="s-font-path"></select>
          </label>
        </div>
      </details>

      <details open>
        <summary>Colors</summary>
        <div class="settings-body">
          <div class="row">
            <label>Text color
              <input type="color" id="s-text-color" />
            </label>
            <label>Outline color
              <input type="color" id="s-outline-color" />
            </label>
          </div>
          <label>Outline width (px)
            <input type="number" id="s-outline-width" min="0" max="20" step="1" />
          </label>
        </div>
      </details>

      <details>
        <summary>Coordinates</summary>
        <div class="settings-body">
          <label class="check-row">
            <input type="checkbox" id="s-show-utm" />
            Show UTM coordinates
          </label>
          <label>Target EPSG
            <input type="number" id="s-target-epsg" min="1000" max="99999" />
          </label>
          <div class="row">
            <label>UTM zone
              <input type="number" id="s-utm-zone" min="1" max="60" />
            </label>
            <label>Hemisphere
              <select id="s-utm-hemisphere">
                <option value="N">N</option>
                <option value="S">S</option>
              </select>
            </label>
          </div>
        </div>
      </details>

      <details>
        <summary>Direction</summary>
        <div class="settings-body">
          <label class="check-row">
            <input type="checkbox" id="s-show-direction" />
            Show direction
          </label>
          <label>Precision
            <select id="s-direction-precision">
              <option value="8">8 sectors (N, NE, E…)</option>
              <option value="16">16 sectors (N, NNE, NE…)</option>
            </select>
          </label>
        </div>
      </details>

      <details>
        <summary>Address</summary>
        <div class="settings-body">
          <label class="check-row">
            <input type="checkbox" id="s-show-address" />
            Lookup nearest address
          </label>
          <label>Geocoder timeout (s)
            <input type="number" id="s-geocoder-timeout" min="1" max="30" />
          </label>
        </div>
      </details>

      <details>
        <summary>Output</summary>
        <div class="settings-body">
          <label>
            JPEG quality &nbsp;<span class="range-val" id="quality-val">95</span>
            <input type="range" id="s-output-quality" min="1" max="100" step="1" />
          </label>
          <label>File collision
            <select id="s-file-collision">
              <option value="overwrite">Overwrite</option>
              <option value="skip">Skip existing</option>
              <option value="rename">Rename (add suffix)</option>
            </select>
          </label>
        </div>
      </details>

      <details>
        <summary>Processing</summary>
        <div class="settings-body">
          <label>Parallel workers
            <input type="number" id="s-max-workers" min="1" max="32" />
          </label>
        </div>
      </details>

    </div>
  </div>

  <!-- ══ CENTER: Map & Preview ══ -->
  <div class="preview-panel">
    <div class="center-tabs">
      <button class="center-tab active" id="tab-preview" onclick="switchCenterTab('preview')">Preview</button>
      <button class="center-tab" id="tab-map" onclick="switchCenterTab('map')">Map</button>
    </div>
    
    <!-- Preview tab content -->
    <div id="preview-container-wrapper" class="active">
      <div class="preview-toolbar">
        <button class="btn btn-accent" id="btn-preview" disabled>Generate Preview</button>
        <span id="preview-filename">No image selected</span>
      </div>
      <div class="preview-container">
        <div class="preview-placeholder" id="preview-placeholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <path d="M21 15l-5-5L5 21"/>
          </svg>
          <span>Select an image and click Generate Preview</span>
        </div>
        <img id="preview-img" alt="Preview" />
        <div id="preview-spinner"><div class="spinner"></div></div>
      </div>
    </div>
    
    <!-- Map tab content -->
    <div id="map-container">
      <div id="map"></div>
      <div class="map-controls">
        <button class="btn" id="btn-reset-location" disabled title="Reset selected image location">Reset Location</button>
        <button class="btn" id="btn-reset-all-locations" disabled title="Reset all location edits">Reset All</button>
      </div>
    </div>
  </div>

  <!-- ══ RIGHT: Image list ══ -->
  <div class="panel">
    <div class="panel-title">Images <span id="image-count" style="color:var(--muted);font-weight:400"></span></div>
    <div class="selection-bar" id="selection-bar">
      <span id="selection-label">0 selected</span>
      <button class="btn btn-amber" id="btn-select-all" style="padding:3px 9px;font-size:.73rem">All</button>
      <button class="btn" id="btn-clear-selection" style="padding:3px 9px;font-size:.73rem">Clear</button>
    </div>
    <div class="panel-scroll">
      <div id="image-list">
        <p class="no-images">Load a folder or upload files to begin.</p>
      </div>
    </div>
  </div>

</div>

<!-- ══ BOTTOM BAR ══ -->
<div class="bottombar">

  <!-- Input tabs -->
  <div class="input-tabs">
    <button class="tab-btn active" id="tab-folder" onclick="switchTab('folder')">Folder</button>
    <button class="tab-btn" id="tab-upload" onclick="switchTab('upload')">Upload</button>
  </div>

  <!-- Folder tab -->
  <div id="folder-input-area">
    <input type="text" id="folder-path-input" placeholder="Input folder path…" />
    <button class="btn" id="btn-load-folder">Load</button>
  </div>

  <!-- Upload tab -->
  <div id="upload-input-area">
    <div id="drop-zone" onclick="document.getElementById('file-picker').click()">
      Drop JPG files here or click to browse
    </div>
    <input type="file" id="file-picker" accept=".jpg,.jpeg" multiple style="display:none" />
  </div>

  <!-- Output dir -->
  <span class="output-label">→ Output:</span>
  <input type="text" id="output-path-input" placeholder="Output folder (leave blank for input/processed)" style="width:220px" />

  <!-- Process selected / all -->
  <button class="btn btn-amber" id="btn-process-selected" disabled>Process Selected</button>
  <button class="btn btn-green" id="btn-process" disabled>Process All</button>

  <!-- Progress + status -->
  <div class="progress-wrap">
    <progress id="progress-bar" value="0" max="100"></progress>
    <span id="progress-label">–</span>
  </div>
  <span id="status-msg"></span>

</div>

<script>
// ── State ──
let state = {
  sourceFolder: '',
  images: [],
  selectedImage: null,     // for preview
  selectedSet: new Set(),  // for processing
  jobId: null,
  sseSource: null,
};

// ── Helpers ──
function rgb2hex(r, g, b) {
  return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
}
function hex2rgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return [r, g, b];
}
function setStatus(msg, type = 'info') {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = type;
}
function clearStatus() {
  const el = document.getElementById('status-msg');
  el.className = '';
  el.textContent = '';
}

// ── Load defaults from API ──
async function loadDefaults() {
  try {
    const res = await fetch('/api/settings');
    const d = await res.json();

    document.getElementById('s-project-info').value = d.project_info || '';
    document.getElementById('s-text-position').value = d.text_position;
    document.getElementById('s-padding').value = d.padding;
    document.getElementById('s-font-size').value = d.font_size;
    document.getElementById('s-text-color').value = rgb2hex(d.text_color_r, d.text_color_g, d.text_color_b);
    document.getElementById('s-outline-color').value = rgb2hex(d.outline_color_r, d.outline_color_g, d.outline_color_b);
    document.getElementById('s-outline-width').value = d.outline_width;
    document.getElementById('s-show-utm').checked = d.show_utm;
    document.getElementById('s-target-epsg').value = d.target_epsg;
    document.getElementById('s-utm-zone').value = d.utm_zone;
    document.getElementById('s-utm-hemisphere').value = d.utm_hemisphere;
    document.getElementById('s-show-direction').checked = d.show_direction;
    document.getElementById('s-direction-precision').value = String(d.direction_precision);
    document.getElementById('s-show-address').checked = d.show_address;
    document.getElementById('s-geocoder-timeout').value = d.geocoder_timeout;
    document.getElementById('s-output-quality').value = d.output_quality;
    document.getElementById('quality-val').textContent = d.output_quality;
    document.getElementById('s-file-collision').value = d.file_collision_mode;
    document.getElementById('s-max-workers').value = d.max_workers;
    document.getElementById('folder-path-input').value = d.input_dir || '';
    document.getElementById('output-path-input').value = d.output_dir || '';
  } catch (e) {
    console.error('Failed to load defaults', e);
  }
}

// ── Load font list ──
async function loadFonts() {
  try {
    const res = await fetch('/api/fonts');
    const d = await res.json();
    const sel = document.getElementById('s-font-path');
    sel.innerHTML = '';
    const defaults = await fetch('/api/settings').then(r => r.json());
    for (const f of d.fonts) {
      const opt = document.createElement('option');
      opt.value = f;
      opt.textContent = f.split('/').pop();
      if (f === defaults.font_path) opt.selected = true;
      sel.appendChild(opt);
    }
    if (d.fonts.length === 0) {
      const opt = document.createElement('option');
      opt.value = 'fonts/arial.ttf';
      opt.textContent = 'arial.ttf (default)';
      sel.appendChild(opt);
    }
  } catch (e) {
    console.error('Failed to load fonts', e);
  }
}

// ── Gather settings from form ──
function gatherSettings() {
  const [tr, tg, tb] = hex2rgb(document.getElementById('s-text-color').value);
  const [or, og, ob] = hex2rgb(document.getElementById('s-outline-color').value);
  return {
    project_info: document.getElementById('s-project-info').value,
    text_position: document.getElementById('s-text-position').value,
    padding: parseInt(document.getElementById('s-padding').value) || 30,
    font_size: parseInt(document.getElementById('s-font-size').value) || 128,
    font_path: document.getElementById('s-font-path').value,
    text_color_r: tr, text_color_g: tg, text_color_b: tb,
    outline_color_r: or, outline_color_g: og, outline_color_b: ob,
    outline_width: parseInt(document.getElementById('s-outline-width').value) || 2,
    show_utm: document.getElementById('s-show-utm').checked,
    target_epsg: parseInt(document.getElementById('s-target-epsg').value) || 25832,
    utm_zone: parseInt(document.getElementById('s-utm-zone').value) || 32,
    utm_hemisphere: document.getElementById('s-utm-hemisphere').value,
    show_direction: document.getElementById('s-show-direction').checked,
    direction_precision: parseInt(document.getElementById('s-direction-precision').value),
    show_address: document.getElementById('s-show-address').checked,
    geocoder_timeout: parseInt(document.getElementById('s-geocoder-timeout').value) || 5,
    output_quality: parseInt(document.getElementById('s-output-quality').value) || 95,
    file_collision_mode: document.getElementById('s-file-collision').value,
    max_workers: parseInt(document.getElementById('s-max-workers').value) || 4,
    output_dir: document.getElementById('output-path-input').value,
  };
}

// ── Input tab switch ──
function switchTab(tab) {
  document.getElementById('tab-folder').classList.toggle('active', tab === 'folder');
  document.getElementById('tab-upload').classList.toggle('active', tab === 'upload');
  document.getElementById('folder-input-area').style.display = tab === 'folder' ? 'flex' : 'none';
  document.getElementById('upload-input-area').style.display = tab === 'upload' ? 'flex' : 'none';
}

// ── Selection helpers ──
function updateSelectionUI() {
  const n = state.selectedSet.size;
  const bar = document.getElementById('selection-bar');
  const label = document.getElementById('selection-label');
  bar.classList.toggle('visible', n > 0);
  label.textContent = `${n} selected`;
  document.getElementById('btn-process-selected').disabled = n === 0;
}

// ── Populate image list ──
function populateImageList(images, sourceFolder) {
  state.images = images;
  state.sourceFolder = sourceFolder;
  state.selectedImage = null;
  state.selectedSet.clear();

  const list = document.getElementById('image-list');
  list.innerHTML = '';
  document.getElementById('image-count').textContent = `(${images.length})`;
  updateSelectionUI();

  if (images.length === 0) {
    list.innerHTML = '<p class="no-images">No JPG images found.</p>';
    document.getElementById('btn-process').disabled = true;
    return;
  }

  for (const name of images) {
    const div = document.createElement('div');
    div.className = 'img-item';
    // checkbox indicator + name + edit indicator
    const editIndicator = '<span class="edit-indicator" style="display:none;color:var(--warning);margin-left:4px;" title="Location edited">📍</span>';
    div.innerHTML = `<span class="check"></span>${name}${editIndicator}`;
    div.title = name;
    div.dataset.name = name;
    div.addEventListener('click', e => handleItemClick(name, div, e));
    list.appendChild(div);
  }

  document.getElementById('btn-process').disabled = false;
}

function handleItemClick(name, el, e) {
  // Ctrl/Cmd or Shift toggles selection; plain click sets preview target
  if (e.ctrlKey || e.metaKey || e.shiftKey) {
    // toggle selection
    if (state.selectedSet.has(name)) {
      state.selectedSet.delete(name);
      el.classList.remove('selected');
    } else {
      state.selectedSet.add(name);
      el.classList.add('selected');
    }
    updateSelectionUI();
  } else {
    // plain click: set as preview target (does NOT clear multi-selection)
    document.querySelectorAll('.img-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    state.selectedImage = name;
    document.getElementById('preview-filename').textContent = name;
    document.getElementById('btn-preview').disabled = false;
  }
}

function selectImage(name, el) {
  document.querySelectorAll('.img-item').forEach(i => i.classList.remove('active'));
  if (el) el.classList.add('active');
  state.selectedImage = name;
  document.getElementById('preview-filename').textContent = name;
  document.getElementById('btn-preview').disabled = false;
}

function updateImageList() {
  // Update edit indicators for all images
  document.querySelectorAll('.img-item').forEach(div => {
    const name = div.dataset.name;
    const indicator = div.querySelector('.edit-indicator');
    
    if (imageLocations[name]?.edited) {
      if (indicator) indicator.style.display = 'inline';
    } else {
      if (indicator) indicator.style.display = 'none';
    }
    
    // Update active state
    if (name === state.selectedImage) {
      div.classList.add('active');
    } else {
      div.classList.remove('active');
    }
  });
}

// Select all / clear
document.getElementById('btn-select-all').addEventListener('click', () => {
  state.selectedSet = new Set(state.images);
  document.querySelectorAll('.img-item').forEach(el => el.classList.add('selected'));
  updateSelectionUI();
});
document.getElementById('btn-clear-selection').addEventListener('click', () => {
  state.selectedSet.clear();
  document.querySelectorAll('.img-item').forEach(el => el.classList.remove('selected'));
  updateSelectionUI();
});

// ── Load folder ──
document.getElementById('btn-load-folder').addEventListener('click', async () => {
  const path = document.getElementById('folder-path-input').value.trim();
  if (!path) { setStatus('Enter a folder path first', 'err'); return; }
  setStatus('Scanning folder…', 'info');
  try {
    const res = await fetch('/api/load-folder', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path }),
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus(err.detail || 'Failed to load folder', 'err');
      return;
    }
    const d = await res.json();
    populateImageList(d.images, d.source_folder);
    setStatus(`Loaded ${d.images.length} image(s). Address lookup running in background…`, 'ok');
    
    // Refresh map if it exists
    if (map) {
      await refreshMapLocations();
    }
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
  }
});

document.getElementById('folder-path-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('btn-load-folder').click();
});

// ── File upload ──
async function handleFiles(fileList) {
  if (!fileList || fileList.length === 0) return;
  setStatus(`Uploading ${fileList.length} file(s)…`, 'info');
  const formData = new FormData();
  for (const f of fileList) formData.append('files', f);
  try {
    const res = await fetch('/api/upload', { method: 'POST', body: formData });
    if (!res.ok) {
      const err = await res.json();
      setStatus(err.detail || 'Upload failed', 'err');
      return;
    }
    const d = await res.json();
    populateImageList(d.images, d.source_folder);
    setStatus(`Uploaded ${d.images.length} image(s).`, 'ok');
    
    // Refresh map if it exists
    if (map) {
      await refreshMapLocations();
    }
  } catch (e) {
    setStatus('Upload error: ' + e.message, 'err');
  }
}

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  handleFiles(e.dataTransfer.files);
});
document.getElementById('file-picker').addEventListener('change', e => handleFiles(e.target.files));

// ── Generate preview ──
document.getElementById('btn-preview').addEventListener('click', async () => {
  if (!state.selectedImage) return;
  const spinner = document.getElementById('preview-spinner');
  const img = document.getElementById('preview-img');
  const placeholder = document.getElementById('preview-placeholder');

  spinner.classList.add('active');
  clearStatus();

  try {
    const res = await fetch('/api/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename: state.selectedImage,
        source_folder: state.sourceFolder,
        settings: gatherSettings(),
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus(err.detail || 'Preview failed', 'err');
      return;
    }
    const d = await res.json();
    img.src = 'data:image/jpeg;base64,' + d.image;
    img.style.display = 'block';
    placeholder.style.display = 'none';
  } catch (e) {
    setStatus('Preview error: ' + e.message, 'err');
  } finally {
    spinner.classList.remove('active');
  }
});

// ── Shared processing trigger ──
async function triggerProcess(filenames) {
  if (!state.sourceFolder) { setStatus('No images loaded', 'err'); return; }

  const settings = gatherSettings();
  const outputDir = document.getElementById('output-path-input').value.trim();
  const isAll = filenames.length === 0;
  const label = isAll ? `all ${state.images.length}` : `${filenames.length} selected`;

  setStatus(`Starting processing for ${label} image(s)…`, 'info');
  document.getElementById('btn-process').disabled = true;
  document.getElementById('btn-process-selected').disabled = true;

  try {
    const res = await fetch('/api/process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source_folder: state.sourceFolder,
        output_dir: outputDir,
        settings,
        filenames,
      }),
    });
    if (!res.ok) {
      const err = await res.json();
      setStatus(err.detail || 'Failed to start processing', 'err');
      document.getElementById('btn-process').disabled = false;
      document.getElementById('btn-process-selected').disabled = state.selectedSet.size === 0;
      return;
    }
    const d = await res.json();
    state.jobId = d.job_id;
    startProgressStream(d.job_id, d.total);
  } catch (e) {
    setStatus('Error: ' + e.message, 'err');
    document.getElementById('btn-process').disabled = false;
    document.getElementById('btn-process-selected').disabled = state.selectedSet.size === 0;
  }
}

// ── Process All ──
document.getElementById('btn-process').addEventListener('click', () => triggerProcess([]));

// ── Process Selected ──
document.getElementById('btn-process-selected').addEventListener('click', () => {
  if (state.selectedSet.size === 0) return;
  triggerProcess([...state.selectedSet]);
});

function startProgressStream(jobId, total) {
  if (state.sseSource) state.sseSource.close();

  const progressBar = document.getElementById('progress-bar');
  const progressLabel = document.getElementById('progress-label');
  progressBar.max = total;

  const source = new EventSource(`/api/progress/${jobId}`);
  state.sseSource = source;

  source.onmessage = e => {
    const d = JSON.parse(e.data);
    progressBar.value = d.processed || 0;
    progressLabel.textContent = `${d.processed || 0} / ${d.total || total}`;

    if (d.status === 'done') {
      source.close();
      state.sseSource = null;
      const results = d.results || [];
      const failed = results.filter(r => !r.success).length;
      const ok = results.length - failed;
      if (failed === 0) {
        setStatus(`✓ All ${ok} images processed successfully.`, 'ok');
      } else {
        setStatus(`Done: ${ok} ok, ${failed} failed.`, 'err');
      }
      document.getElementById('btn-process').disabled = false;
      document.getElementById('btn-process-selected').disabled = state.selectedSet.size === 0;
    } else if (d.current_file) {
      setStatus(`Processing: ${d.current_file}`, 'info');
    }
  };

  source.onerror = () => {
    source.close();
    state.sseSource = null;
    document.getElementById('btn-process').disabled = false;
    document.getElementById('btn-process-selected').disabled = state.selectedSet.size === 0;
  };
}

// ── Quality range display ──
document.getElementById('s-output-quality').addEventListener('input', e => {
  document.getElementById('quality-val').textContent = e.target.value;
});

// ── Init ──
(async () => {
  await loadDefaults();
  await loadFonts();
})();

// ── Map & Location Management ──
let map = null;
let markers = {};  // filename -> marker
let imageLocations = {};  // filename -> {lat, lon, has_gps, edited}

function switchCenterTab(tab) {
  const tabs = document.querySelectorAll('.center-tab');
  const preview = document.getElementById('preview-container-wrapper');
  const mapContainer = document.getElementById('map-container');
  
  tabs.forEach(t => t.classList.remove('active'));
  
  if (tab === 'map') {
    document.getElementById('tab-map').classList.add('active');
    preview.classList.remove('active');
    mapContainer.classList.add('active');
    
    if (!map) {
      initMap();
    } else {
      map.invalidateSize();
    }
  } else {
    document.getElementById('tab-preview').classList.add('active');
    mapContainer.classList.remove('active');
    preview.classList.add('active');
  }
}

function initMap() {
  map = L.map('map').setView([59.9, 10.75], 6);  // Norway default
  
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);
  
  // Load and display image locations
  refreshMapLocations();
}

async function refreshMapLocations() {
  if (!state.sourceFolder || !map) return;
  
  try {
    const res = await fetch(`/api/image-locations?source_folder=${encodeURIComponent(state.sourceFolder)}`);
    if (!res.ok) return;
    
    const data = await res.json();
    imageLocations = {};
    
    // Clear existing markers
    Object.values(markers).forEach(m => map.removeLayer(m));
    markers = {};
    
    const bounds = [];
    
    data.locations.forEach(loc => {
      imageLocations[loc.filename] = loc;
      
      if (loc.has_gps && loc.lat != null && loc.lon != null) {
        const marker = L.marker([loc.lat, loc.lon], {
          draggable: true,
          title: loc.filename
        });
        
        marker.bindPopup(`<strong>${loc.filename}</strong><br>
          ${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)}<br>
          ${loc.address || 'No address'}`);
        
        marker.on('click', () => selectImageFromMap(loc.filename));
        marker.on('dragend', (e) => onMarkerDrag(loc.filename, e.target.getLatLng()));
        
        if (loc.edited) {
          marker.getElement()?.classList.add('edited-marker');
        }
        
        marker.addTo(map);
        markers[loc.filename] = marker;
        bounds.push([loc.lat, loc.lon]);
      }
    });
    
    // Fit map to show all markers
    if (bounds.length > 0) {
      map.fitBounds(bounds, { padding: [50, 50] });
    }
    
    updateMapControls();
  } catch (e) {
    console.error('Failed to load image locations:', e);
  }
}

function selectImageFromMap(filename) {
  state.selectedImage = filename;
  updateImageList();
  highlightSelectedMarker();
  updateMapControls();
}

function highlightSelectedMarker() {
  // Reset all markers
  Object.values(markers).forEach(m => {
    m.setOpacity(1.0);
  });
  
  // Highlight selected
  if (state.selectedImage && markers[state.selectedImage]) {
    markers[state.selectedImage].setOpacity(0.6);
    markers[state.selectedImage].openPopup();
  }
}

async function onMarkerDrag(filename, latlng) {
  try {
    const res = await fetch('/api/update-location', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename,
        lat: latlng.lat,
        lon: latlng.lng
      })
    });
    
    if (res.ok) {
      const marker = markers[filename];
      marker.getElement()?.classList.add('edited-marker');
      
      // Update local state
      if (imageLocations[filename]) {
        imageLocations[filename].edited = true;
        imageLocations[filename].lat = latlng.lat;
        imageLocations[filename].lon = latlng.lng;
      }
      
      // Update image list to show edited indicator
      updateImageList();
      updateMapControls();
      
      setStatus(`Updated location for ${filename}`, 'ok');
    }
  } catch (e) {
    console.error('Failed to update location:', e);
    setStatus('Failed to update location', 'err');
  }
}

async function resetLocation(filename) {
  try {
    const res = await fetch('/api/update-location', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename,
        reset: true
      })
    });
    
    if (res.ok) {
      setStatus(`Reset location for ${filename}`, 'ok');
      await refreshMapLocations();
    }
  } catch (e) {
    console.error('Failed to reset location:', e);
    setStatus('Failed to reset location', 'err');
  }
}

async function resetAllLocations() {
  const editedFiles = Object.keys(imageLocations).filter(f => imageLocations[f].edited);
  
  if (editedFiles.length === 0) {
    setStatus('No edited locations to reset', 'info');
    return;
  }
  
  if (!confirm(`Reset ${editedFiles.length} edited location(s)?`)) {
    return;
  }
  
  for (const filename of editedFiles) {
    await resetLocation(filename);
  }
}

function updateMapControls() {
  const hasSelected = state.selectedImage && imageLocations[state.selectedImage]?.edited;
  const hasAnyEdited = Object.values(imageLocations).some(loc => loc.edited);
  
  document.getElementById('btn-reset-location').disabled = !hasSelected;
  document.getElementById('btn-reset-all-locations').disabled = !hasAnyEdited;
}

document.getElementById('btn-reset-location').addEventListener('click', () => {
  if (state.selectedImage) {
    resetLocation(state.selectedImage);
  }
});

document.getElementById('btn-reset-all-locations').addEventListener('click', resetAllLocations);

</script>
